<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc">
<title id="title">太上老君AI炼丹炉：创作方法全景图</title>
<desc id="desc">先认识使用者，按当前任务调度选材、看火、开炉、回炉、收丹、成丹六模块，结合个人底味和真实反馈复盘。</desc>
<rect width="1200" height="1250" rx="24" fill="#101725"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif">

<text x="44" y="66" font-size="42" fill="#ffd36a" font-weight="700">太上老君 · AI炼丹炉</text>
<text x="44" y="108" font-size="25" fill="#d4dce9" font-weight="400">教创作思路，帮助你做出自己的内容</text>
<text x="44" y="146" font-size="22" fill="#9facbf" font-weight="400">不同赛道都可以开始 · 按需选模块，不必从头走完</text>
<rect x="40" y="180" width="1120" height="125" rx="16" fill="#192439" stroke="#ffd36a"/>
<text x="64" y="219" font-size="28" fill="#ffd36a" font-weight="700">先认识你，再帮你炼丹</text>
<text x="64" y="255" font-size="24" fill="#d4dce9" font-weight="400">你做过什么？有什么素材？想给谁看？现在卡在哪一步？</text>
<text x="64" y="285" font-size="21" fill="#9facbf" font-weight="400">一次聊一个具体问题；已有稿只改标题，就直接改标题。</text>
<text x="44" y="355" font-size="25" fill="#eef3fc" font-weight="600">总入口：读已有材料 → 判断缺哪一步 → 调用必要模块 → 完成交付</text>
<rect x="40" y="390" width="545" height="197" rx="16" fill="#192439" stroke="#ff898d"/>
<text x="62" y="429" font-size="28" fill="#ff898d" font-weight="650">01  选材 · 掂量三关</text>
<text x="62" y="466" font-size="22" fill="#d4dce9" font-weight="400">复读：口吻能否自然表达</text>
<text x="62" y="497" font-size="22" fill="#d4dce9" font-weight="400">观众：为什么愿意看、能得到什么</text>
<text x="62" y="528" font-size="22" fill="#d4dce9" font-weight="400">替换：换成你的条件还能成立吗</text>
<text x="62" y="559" font-size="22" fill="#ff898d" font-weight="400">交付：借鉴机制与适配建议</text>
<rect x="615" y="390" width="545" height="197" rx="16" fill="#192439" stroke="#ffbd72"/>
<text x="637" y="429" font-size="28" fill="#ffbd72" font-weight="650">02  看火 · 选题判断</text>
<text x="637" y="466" font-size="22" fill="#d4dce9" font-weight="400">人群、认知、钩子、证据、上手成本</text>
<text x="637" y="497" font-size="22" fill="#d4dce9" font-weight="400">从真实经历、参考、热点和反馈找方向</text>
<text x="637" y="528" font-size="22" fill="#d4dce9" font-weight="400">推荐时说清：为什么是你能拍的</text>
<text x="637" y="559" font-size="22" fill="#ffbd72" font-weight="400">交付：少量具体方向与选择理由</text>
<rect x="40" y="609" width="545" height="197" rx="16" fill="#192439" stroke="#78dcad"/>
<text x="62" y="648" font-size="28" fill="#78dcad" font-weight="650">03  开炉 · 开头与结构</text>
<text x="62" y="685" font-size="22" fill="#d4dce9" font-weight="400">场景服务目的，开头紧接真实证据</text>
<text x="62" y="716" font-size="22" fill="#d4dce9" font-weight="400">口播、画面、标题分担信息</text>
<text x="62" y="747" font-size="22" fill="#d4dce9" font-weight="400">五段式按需用，时长服从内容</text>
<text x="62" y="778" font-size="22" fill="#78dcad" font-weight="400">交付：开头、结构与必要拍摄建议</text>
<rect x="615" y="609" width="545" height="197" rx="16" fill="#192439" stroke="#c8a4ff"/>
<text x="637" y="648" font-size="28" fill="#c8a4ff" font-weight="650">04  回炉 · 完整成稿</text>
<text x="637" y="685" font-size="22" fill="#d4dce9" font-weight="400">逐字稿是弹药库，借观点不照搬</text>
<text x="637" y="716" font-size="22" fill="#d4dce9" font-weight="400">用自己的素材组织逻辑递进</text>
<text x="637" y="747" font-size="22" fill="#d4dce9" font-weight="400">保留本人表达，不编经历和数字</text>
<text x="637" y="778" font-size="22" fill="#c8a4ff" font-weight="400">交付：完整稿或指定段落的修改</text>
<rect x="40" y="828" width="545" height="197" rx="16" fill="#192439" stroke="#8ec9ff"/>
<text x="62" y="867" font-size="28" fill="#8ec9ff" font-weight="650">05  收丹 · 标题</text>
<text x="62" y="904" font-size="22" fill="#d4dce9" font-weight="400">跟我有关：认人、认事、认心</text>
<text x="62" y="935" font-size="22" fill="#d4dce9" font-weight="400">补全信息、制造期待、承担总结</text>
<text x="62" y="966" font-size="22" fill="#d4dce9" font-weight="400">先有确定内容，再选适合的标题</text>
<text x="62" y="997" font-size="22" fill="#8ec9ff" font-weight="400">交付：用户需要的标题与理由</text>
<rect x="615" y="828" width="545" height="197" rx="16" fill="#192439" stroke="#ffd36a"/>
<text x="637" y="867" font-size="28" fill="#ffd36a" font-weight="650">06  成丹 · 变现承接</text>
<text x="637" y="904" font-size="22" fill="#d4dce9" font-weight="400">只在用户明确有商业目标时使用</text>
<text x="637" y="935" font-size="22" fill="#d4dce9" font-weight="400">预期用户与实际需求分开看</text>
<text x="637" y="966" font-size="22" fill="#d4dce9" font-weight="400">点赞、咨询、付费不能混为一谈</text>
<text x="637" y="997" font-size="22" fill="#ffd36a" font-weight="400">交付：可兑现的小范围验证路径</text>
<rect x="40" y="1065" width="1120" height="135" rx="16" fill="#192439" stroke="#34445c"/>
<text x="63" y="1105" font-size="28" fill="#eef3fc" font-weight="650">按需使用：经历提炼 + 素材卡 + 反馈复盘</text>
<text x="63" y="1143" font-size="23" fill="#d4dce9" font-weight="400">像你本人说话；不为去AI味编事实。发过后比较目标与实际，再调整。</text>
<text x="63" y="1178" font-size="21" fill="#9facbf" font-weight="400">有情、有趣、有人、有事，不必四项齐全。方法是判断工具，不是流量保证。</text>
<text x="40" y="1230" font-size="20" fill="#9facbf" font-weight="400">点击此图进入可展开的交互版 · 也可直接阅读下方使用说明</text>
</g></svg>
